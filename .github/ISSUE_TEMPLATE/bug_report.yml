name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security issues, do not file here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run `nlsh`\n2. Type ...\n3. See error"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: nlsh version
      description: Version or commit hash
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend and model
      placeholder: Ollama / llama.cpp, model name
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From ~/.local/state/nlsh/. Remove anything private.
      render: shell
