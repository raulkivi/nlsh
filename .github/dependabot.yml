version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Waits out the window in which compromised releases are usually yanked.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # pydantic pins pydantic-core exactly; bumping the core alone breaks the install.
    ignore:
      - dependency-name: pydantic-core
    groups:
      dev:
        patterns: ['*']
