[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlsh"
version = "1.3"
description = "AI-powered command assistant — translates natural language into Linux/shell commands"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Raul Kivi" },
]
keywords = ["cli", "shell", "ai", "ollama", "llm", "commands"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "ollama>=0.6.2",
    "termcolor>=3.3.0",
    "pyperclip>=1.11.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
nlsh = "nlsh:main"
ask = "ask:main"

[project.urls]
Homepage = "https://github.com/raulkivi/nlsh"
"Bug Tracker" = "https://github.com/raulkivi/nlsh/issues"

[tool.setuptools]
py-modules = ["nlsh", "ask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
